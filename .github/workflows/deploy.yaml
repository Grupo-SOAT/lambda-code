name: Lambda CI and deploy
on:
  pull_request:
    branches: [main, homologacao]
  push:
    branches: [main, homologacao]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lambda-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash mvnw -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: target/lambda-code.jar
  deploy:
    needs: test
    if: github.repository == 'Grupo-SOAT/lambda-code' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homologacao')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'producao' || 'homologacao' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: dist/lib
      - name: Validate required configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          BUCKET: ${{ vars.TF_LAMBDA_BUCKET }}
          VALIDATOR: ${{ vars.LAMBDA_VALIDATOR_NAME }}
          AUTHORIZER: ${{ vars.LAMBDA_AUTHORIZER_NAME }}
          INFRA_REPO_URL: ${{ vars.GIT_INFRA_REPO_URL }}
          GH_TOKEN: ${{ secrets.PAT_REPO_INFRA_LAMBDA }}
        run: |
          : "${AWS_REGION:?Configure a variável AWS_REGION}"
          : "${BUCKET:?Configure a variável TF_LAMBDA_BUCKET}"
          : "${VALIDATOR:?Configure a variável LAMBDA_VALIDATOR_NAME}"
          : "${AUTHORIZER:?Configure a variável LAMBDA_AUTHORIZER_NAME}"
          : "${INFRA_REPO_URL:?Configure a variável GIT_INFRA_REPO_URL}"
          : "${GH_TOKEN:?Configure o secret PAT_REPO_INFRA_LAMBDA}"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publish tested package and notify infra
        env:
          BUCKET: ${{ vars.TF_LAMBDA_BUCKET }}
          VALIDATOR: ${{ vars.LAMBDA_VALIDATOR_NAME }}
          AUTHORIZER: ${{ vars.LAMBDA_AUTHORIZER_NAME }}
          ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'producao' || 'homologacao' }}
          INFRA_REPO_URL: ${{ vars.GIT_INFRA_REPO_URL }}
          GH_TOKEN: ${{ secrets.PAT_REPO_INFRA_LAMBDA }}
        run: |
          set -euo pipefail

          (cd dist && zip -r lambda.zip lib)
          KEY="$ENVIRONMENT/$GITHUB_SHA/lambda.zip"
          aws s3 cp dist/lambda.zip "s3://$BUCKET/$KEY"

          HASH=$(openssl dgst -sha256 -binary dist/lambda.zip | base64 -w 0)

          for FUNCTION in "$VALIDATOR" "$AUTHORIZER"; do
            set +e
            ERROR=$(aws lambda get-function-configuration --function-name "$FUNCTION" 2>&1 >/dev/null)
            RC=$?
            set -e

            if [ "$RC" -eq 0 ]; then
              echo "Atualizando $FUNCTION"
              aws lambda update-function-code --function-name "$FUNCTION" --s3-bucket "$BUCKET" --s3-key "$KEY" >/dev/null
              aws lambda wait function-updated-v2 --function-name "$FUNCTION"
            elif printf '%s' "$ERROR" | grep -q "ResourceNotFoundException"; then
              echo "Função $FUNCTION ainda não existe; o Terraform irá criá-la com $KEY"
            else
              echo "$ERROR" >&2
              exit "$RC"
            fi
          done

          INFRA_REPO="${INFRA_REPO_URL#https://github.com/}"
          INFRA_REPO="${INFRA_REPO%.git}"
          INFRA_REPO="${INFRA_REPO%/}"

          curl -sS -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${INFRA_REPO}/dispatches" \
            -d "{
              \"event_type\": \"lambda-updated\",
              \"client_payload\": {
                \"lambda_key\": \"${KEY}\",
                \"lambda_hash\": \"${HASH}\"
              }
            }"

          echo "Artefato publicado e k8s-infra notificado."
